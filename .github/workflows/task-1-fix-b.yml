# Fix B, for when you genuinely need two jobs. Five lines added.
# needs decides WHEN two starts. The artifact decides WHERE the file lives
# in between. You need both: without needs, two can start downloading before
# one has finished uploading.

name: Task 1 - fix B, artifact

on: workflow_dispatch

jobs:
  one:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Runner - $RUNNER_NAME"
      - run: echo "A" > note.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: note, path: note.txt, retention-days: 1}

  two:
    needs: one
    runs-on: ubuntu-latest
    steps:
      - run: echo "Runner - $RUNNER_NAME"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: note}
      - run: cat note.txt
