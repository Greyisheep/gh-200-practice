# Task 1: two jobs, one file, one trap. This workflow is MEANT to fail.
# Each job prints its runner name. The numbers are different, because each
# job gets its own machine and job one's machine is gone before two starts.

name: Task 1 - two jobs, one file

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  one:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Runner - $RUNNER_NAME"
      - run: echo "A" > note.txt
      - run: cat note.txt

  two:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Runner - $RUNNER_NAME"
      - run: cat note.txt
